name: Check Flight Prices (30 mins)

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger FareWatch Price Check Cron
        run: |
          echo "Triggering price check at ${{ secrets.APP_URL }}/api/cron/check-prices"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "${{ secrets.APP_URL }}/api/cron/check-prices" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')
          
          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Cron price check failed with status $HTTP_STATUS"
            exit 1
          fi

          # The endpoint returns 200 even if some watches failed; fail the run so it shows up red
          if [ "$(echo "$BODY" | jq -r '.success')" != "true" ]; then
            echo "Price check finished with errors:"
            echo "$BODY" | jq -r '.summary.errors[]?'
            exit 1
          fi
